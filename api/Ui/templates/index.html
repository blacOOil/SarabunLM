<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SarabunLM</title>
  <link rel="stylesheet" href="/api/Ui/style.css" />
</head>
<body>

  <!-- LOADER (required by showLoader()) -->
  <div id="loader"></div>

  <!-- HEADER -->
  <header class="header">
    <div class="header__brand">SARABUNLM</div>
  </header>

  <!-- MAIN LAYOUT -->
  <div class="layout">

    <!-- SIDEBAR -->
   <aside class="sidebar">

    <div class = "Terminal-wrapper">
        <h1>Terminal</h1>
        <div class="CLI_comander" id="CLI_Commader">
            <div class="input-wrapper">
        <div 
            id="text-output"
            contenteditable="true"
            spellcheck="true">
            command here:
        </div>
        <div 
            id="text-input"
            contenteditable="true"
            spellcheck="true">
        </div>

        </div>
        

    </div>
   </div> 

      <div class="sidebar__footer">
      </div>
    </aside>

    <!-- DOCUMENT PREVIEW -->
    <main class="main">
      
<div class="text-editor" id="text-editor">

    <div class="settings-box">

        <button type="button" data-command="bold">
            <b>B</b>
        </button>

        <button type="button" data-command="italic">
            <i>I</i>
        </button>

        <button type="button" data-command="underline">
            <u>U</u>
        </button>

        <button type="button" data-command="insertUnorderedList">
            • List
        </button>

        <button type="button" data-command="insertOrderedList">
            1. List
        </button>

        <button type="button" data-command="justifyLeft">
            Left
        </button>

        <button type="button" data-command="justifyCenter">
            Center
        </button>

        <button type="button" data-command="justifyRight">
            Right
        </button>

        <button type="button" data-command="removeFormat">
            Clear
        </button>

    </div>

    <div class="input-wrapper">

        <div 
            id="text-input"
            contenteditable="true"
            spellcheck="true">
        </div>

    </div>
   

</div>

        
      </div>

    </main>

  </div>

  <script type="module" src="/api/Ui/app.js"></script>

</body>
</html>
